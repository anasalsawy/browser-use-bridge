name: Deploy VM Shell MCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$VM_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_key "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /home/azureuser/browser-use-bridge
          git fetch origin main
          git reset --hard origin/main

          if ! /usr/bin/node --version 2>/dev/null | grep -q '^v20\|^v21\|^v22\|^v23\|^v24\|^v25'; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          /usr/bin/node --version
          npm install --omit=dev

          sudo tee /etc/systemd/system/vm-shell-mcp.service >/dev/null <<'UNIT'
          [Unit]
          Description=VM Shell MCP Bridge
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=azureuser
          WorkingDirectory=/home/azureuser/browser-use-bridge
          EnvironmentFile=-/home/azureuser/browser-use-bridge/.env
          ExecStart=/usr/bin/node /home/azureuser/browser-use-bridge/server.mjs
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          ProtectHome=read-only
          ReadWritePaths=/home/azureuser

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable vm-shell-mcp
          sudo systemctl restart vm-shell-mcp
          sleep 2
          curl -fsS http://127.0.0.1:8800/health
          echo
          sudo systemctl --no-pager --full status vm-shell-mcp
          REMOTE
