name: Deploy VM services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/azureuser/browser-use-bridge
            git fetch origin main
            git reset --hard origin/main
            node --version
            npm install --omit=dev

            echo '=== VERIFY HF TOKEN ==='
            test -f /home/azureuser/browser-use-bridge/.env
            grep -q '^HF_TOKEN=' /home/azureuser/browser-use-bridge/.env
            sudo mkdir -p /etc/leadpilotai
            sudo grep '^HF_TOKEN=' /home/azureuser/browser-use-bridge/.env | sudo tee /etc/leadpilotai/agent.env >/dev/null
            sudo chmod 640 /etc/leadpilotai/agent.env
            sudo chown root:azureuser /etc/leadpilotai/agent.env

            echo '=== INSTALL/RESTART AGENT ==='
            sudo cp travel-sales-agent/travel-sales-agent.service /etc/systemd/system/travel-sales-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable travel-sales-agent
            sudo systemctl restart travel-sales-agent
            sleep 3
            sudo systemctl is-active --quiet travel-sales-agent

            echo '=== HEALTH ==='
            curl -fsS http://127.0.0.1:8890/health
            echo

            echo '=== REAL AI TEST ==='
            RESPONSE="$(curl -fsS --max-time 90 -X POST http://127.0.0.1:8890/chat -H 'Content-Type: application/json' --data '{"message":"I need one economy ticket from Cairo to Houston on August 20. Reply with a short professional qualification question."}')"
            printf '%s\n' "$RESPONSE"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); c=d.get("choices",[{}])[0].get("message",{}).get("content"); assert c and len(c.strip())>0, d; print("AI_RESPONSE_OK")' "$RESPONSE"

            echo '=== AGENT WORKING ==='
