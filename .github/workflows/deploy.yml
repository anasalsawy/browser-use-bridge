name: Deploy VM services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            trap 'echo "=== DEPLOYMENT FAILED ==="; sudo systemctl status travel-sales-agent --no-pager -l || true; sudo journalctl -u travel-sales-agent -n 160 --no-pager || true; echo "=== PROCESS STATE ==="; pgrep -af "travel-sales-agent|node" || true' ERR
            cd /home/azureuser/browser-use-bridge
            echo '=== SYNC REPOSITORY ==='
            git remote set-url origin https://github.com/anasalsawy/browser-use-bridge.git
            git remote prune origin || true
            git fetch --prune origin main
            git reset --hard origin/main

            echo '=== NODE TOOLCHAIN ==='
            /usr/bin/node --version
            /usr/bin/npm --version
            echo "PATH=$PATH"
            type -a npm || true
            type -a curl || true
            curl --version | head -n 1

            echo '=== VERIFY TOKENS ==='
            test -r .env || { echo 'ERROR: .env missing/unreadable'; exit 1; }
            grep -qE '^HF_TOKEN=[^[:space:]].*$' .env || { echo 'HF_TOKEN: missing/empty'; exit 1; }
            grep -qE '^FB_EMAIL=[^[:space:]].*$' .env || { echo 'FB_EMAIL: missing/empty'; exit 1; }
            grep -qE '^FB_PASSWORD=[^[:space:]].*$' .env || { echo 'FB_PASSWORD: missing/empty'; exit 1; }
            if grep -qE '^FB_OTP_GET_URL=[^[:space:]].*$' .env && grep -qE '^FB_OTP_GET_TOKEN=[^[:space:]].*$' .env; then echo 'FB OTP GET relay: configured'; else echo 'FB OTP GET relay: missing'; fi
            echo 'HF_TOKEN: present'
            echo 'Facebook credentials: present'

            echo '=== BROWSER RUNTIME ==='
            if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y chromium
            fi
            if command -v chromium >/dev/null 2>&1; then chromium --version; else chromium-browser --version; fi

            echo '=== INSTALL TRAVEL AGENT ==='
            cd /home/azureuser/browser-use-bridge/travel-sales-agent
            /usr/bin/npm install --omit=dev --no-audit --no-fund
            test -x node_modules/.bin/playwright
            /usr/bin/node --check server.mjs
            /usr/bin/node --check facebook-llm-auth.mjs
            cd /home/azureuser/browser-use-bridge

            echo '=== INSTALL/RESTART AGENT ==='
            sudo mkdir -p /etc/leadpilotai
            sudo sh -c 'grep -E "^(HF_TOKEN|FB_EMAIL|FB_PASSWORD|FB_OTP_GET_URL|FB_OTP_GET_TOKEN|FB_OTP_URL|FB_OTP_TOKEN|BROWSER_PROFILE_DIR|AI_BASE_URL|AI_MODEL)=" /home/azureuser/browser-use-bridge/.env > /etc/leadpilotai/agent.env'
            sudo chown root:azureuser /etc/leadpilotai/agent.env
            sudo chmod 640 /etc/leadpilotai/agent.env
            sudo cp -f travel-sales-agent/travel-sales-agent.service /etc/systemd/system/travel-sales-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable travel-sales-agent >/dev/null
            sudo systemctl stop travel-sales-agent || true
            sudo fuser -k 8890/tcp || true
            sleep 1
            sudo systemctl start travel-sales-agent
            sleep 5

            echo '=== SERVICE STATUS ==='
            sudo systemctl is-active --quiet travel-sales-agent
            sudo systemctl status travel-sales-agent --no-pager -l | tail -n 35

            echo '=== HEALTH ==='
            HEALTH_RESPONSE="$(curl -sS --max-time 20 -w '\nHTTP_STATUS:%{http_code}\n' http://127.0.0.1:8890/health)"
            printf '%s\n' "$HEALTH_RESPONSE"
            HEALTH_STATUS="$(printf '%s\n' "$HEALTH_RESPONSE" | sed -n 's/^HTTP_STATUS://p' | tail -n 1)"
            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "HEALTH_CHECK_FAILED_HTTP_$HEALTH_STATUS"
              exit 1
            fi
            python3 -c 'import json,sys; raw=sys.argv[1].split("\nHTTP_STATUS:",1)[0]; d=json.loads(raw); assert d.get("ok") is True, d; assert d.get("browser") == "ready", d; print("HEALTH_OK")' "$HEALTH_RESPONSE"

            echo '=== AI + NATIVE CHROMIUM TEST ==='
            AI_RESPONSE="$(curl -sS --max-time 180 -w '\nHTTP_STATUS:%{http_code}\n' -X POST http://127.0.0.1:8890/chat -H 'Content-Type: application/json' --data '{"message":"Use browser_navigate to open https://example.com, then use browser_snapshot. Report exactly the page title and URL returned by the tools."}')"
            printf '%s\n' "$AI_RESPONSE"
            AI_STATUS="$(printf '%s\n' "$AI_RESPONSE" | sed -n 's/^HTTP_STATUS://p' | tail -n 1)"
            if [ "$AI_STATUS" != "200" ]; then
              echo "AI_CHAT_FAILED_HTTP_$AI_STATUS"
              exit 1
            fi
            python3 -c 'import json,sys; raw=sys.argv[1].split("\nHTTP_STATUS:",1)[0]; d=json.loads(raw); c=d.get("choices",[{}])[0].get("message",{}).get("content",""); assert "Example Domain" in c and "example.com" in c, d; print("AI_NATIVE_CHROMIUM_OK")' "$AI_RESPONSE"

            echo '=== FACEBOOK LLM AUTH TEST ==='
            FB_RESPONSE="$(curl -sS --max-time 300 -w '\nHTTP_STATUS:%{http_code}\n' -X POST http://127.0.0.1:8890/chat -H 'Content-Type: application/json' --data '{"message":"Use facebook_authenticate now. The Facebook authentication must be performed by the LLM on the current persistent browser session. Use the existing VM Facebook credentials and existing OTP GET relay when required. Never expose credentials or OTP. After the authentication sub-agent finishes, use facebook_auth_status and report exactly one line in this format: AUTH_RESULT authenticated=<true|false> checkpoint=<true|false>. Do not add any other text after that line."}')"
            printf '%s\n' "$FB_RESPONSE"
            FB_STATUS="$(printf '%s\n' "$FB_RESPONSE" | sed -n 's/^HTTP_STATUS://p' | tail -n 1)"
            if [ "$FB_STATUS" != "200" ]; then
              echo "FACEBOOK_AUTH_CHAT_FAILED_HTTP_$FB_STATUS"
              exit 1
            fi
            python3 -c 'import json,sys,re; raw=sys.argv[1].split("\nHTTP_STATUS:",1)[0]; d=json.loads(raw); c=d.get("choices",[{}])[0].get("message",{}).get("content",""); m=re.search(r"AUTH_RESULT\s+authenticated=(true|false)\s+checkpoint=(true|false)", c, re.I); assert m, {"response":c}; authenticated=m.group(1).lower()=="true"; checkpoint=m.group(2).lower()=="true"; assert authenticated and not checkpoint, {"authenticated":authenticated,"checkpoint":checkpoint,"response":c}; print("FACEBOOK_LLM_AUTH_OK")' "$FB_RESPONSE"

            echo '=== COMPANY AGENT READY: FACEBOOK AUTH VERIFIED ==='
