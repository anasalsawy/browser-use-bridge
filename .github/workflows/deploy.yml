name: Deploy VM services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/azureuser/browser-use-bridge
            echo '=== SYNC REPOSITORY ==='
            git remote set-url origin https://github.com/anasalsawy/browser-use-bridge.git
            git remote prune origin || true
            git fetch --prune origin main
            git reset --hard origin/main

            echo '=== NODE ==='
            /usr/bin/node --version

            echo '=== VERIFY TOKENS ==='
            test -r .env || { echo 'ERROR: .env missing/unreadable'; exit 1; }
            grep -qE '^HF_TOKEN=[^[:space:]].*$' .env || { echo 'HF_TOKEN: missing/empty'; exit 1; }
            grep -qE '^VM_EXEC_TOKEN=[^[:space:]].*$' .env || { echo 'VM_EXEC_TOKEN: missing/empty'; exit 1; }
            echo 'HF_TOKEN: present'
            echo 'VM_EXEC_TOKEN: present'

            echo '=== INSTALL ENVIRONMENT ==='
            sudo mkdir -p /etc/leadpilotai
            sudo sh -c 'grep "^HF_TOKEN=" /home/azureuser/browser-use-bridge/.env > /etc/leadpilotai/agent.env'
            sudo sh -c 'grep "^VM_EXEC_TOKEN=" /home/azureuser/browser-use-bridge/.env >> /etc/leadpilotai/agent.env'
            sudo chown root:azureuser /etc/leadpilotai/agent.env
            sudo chmod 640 /etc/leadpilotai/agent.env
            sudo test -r /etc/leadpilotai/agent.env
            echo 'Agent environment installed'

            echo '=== INSTALL/RESTART AGENT ==='
            sudo cp -f travel-sales-agent/travel-sales-agent.service /etc/systemd/system/travel-sales-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable travel-sales-agent >/dev/null
            sudo systemctl stop travel-sales-agent || true
            # Ensure a stale process cannot hold the agent port.
            sudo fuser -k 8890/tcp || true
            sleep 1
            sudo systemctl start travel-sales-agent
            sleep 3

            echo '=== SERVICE STATUS ==='
            if ! sudo systemctl is-active --quiet travel-sales-agent; then
              echo 'ERROR: travel-sales-agent did not become active'
              sudo systemctl status travel-sales-agent --no-pager -l || true
              sudo journalctl -u travel-sales-agent -n 80 --no-pager || true
              exit 1
            fi
            sudo systemctl status travel-sales-agent --no-pager -l | tail -n 20

            echo '=== HEALTH ==='
            curl -fsS http://127.0.0.1:8890/health
            echo

            echo '=== AI + VM + CHROMIUM TEST ==='
            RESPONSE="$(curl -fsS --max-time 120 -X POST http://127.0.0.1:8890/chat -H 'Content-Type: application/json' --data '{"message":"Use vm_exec now. Run this exact non-destructive browser test: if command -v chromium >/dev/null 2>&1; then chromium --headless --no-sandbox --disable-gpu --dump-dom https://example.com 2>/dev/null | grep -o \"<title>[^<]*</title>\" | head -1; elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --headless --no-sandbox --disable-gpu --dump-dom https://example.com 2>/dev/null | grep -o \"<title>[^<]*</title>\" | head -1; else echo CHROMIUM_NOT_FOUND; fi. Then reply with exactly the tool output."}')"
            printf '%s\n' "$RESPONSE"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); c=d.get("choices",[{}])[0].get("message",{}).get("content",""); assert "Example Domain" in c, d; print("AI_VM_CHROMIUM_OK")' "$RESPONSE"

            echo '=== DEPLOYMENT VERIFIED ==='
