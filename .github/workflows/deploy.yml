name: Deploy VM services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/azureuser/browser-use-bridge
            git fetch origin main
            git reset --hard origin/main

            echo '=== NODE ==='
            node --version
            echo '=== INSTALL ==='
            npm install --omit=dev

            echo '=== LOCATE LEADPILOT AI_API_KEY ==='
            KEY_SOURCE=''
            for f in \
              /home/azureuser/LeadPilotAI/.env \
              /home/azureuser/leadpilotai/.env \
              /home/azureuser/leadpilot/.env \
              /etc/leadpilotai.env \
              /etc/leadpilotai/agent.env; do
              if [ -f "$f" ] && grep -q '^AI_API_KEY=' "$f"; then
                KEY_SOURCE="$f"
                break
              fi
            done
            if [ -z "$KEY_SOURCE" ]; then
              echo 'ERROR: AI_API_KEY was not found in the known LeadPilotAI environment locations.'
              exit 1
            fi
            sudo mkdir -p /etc/leadpilotai
            sudo grep '^AI_API_KEY=' "$KEY_SOURCE" | sudo tee /etc/leadpilotai/agent.env >/dev/null
            sudo chmod 640 /etc/leadpilotai/agent.env
            sudo chown root:azureuser /etc/leadpilotai/agent.env
            echo "AI_API_KEY source found: $KEY_SOURCE (value not printed)"

            echo '=== INSTALL TRAVEL AGENT SERVICE ==='
            sudo cp travel-sales-agent/travel-sales-agent.service /etc/systemd/system/travel-sales-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable travel-sales-agent
            sudo systemctl restart travel-sales-agent
            sleep 4

            echo '=== TRAVEL AGENT STATUS ==='
            sudo systemctl status travel-sales-agent --no-pager -l
            echo '=== TRAVEL AGENT HEALTH ==='
            curl -fsS http://127.0.0.1:8890/health
            echo
            echo '=== FEATHERLESS SMOKE TEST ==='
            curl -fsS -X POST http://127.0.0.1:8890/chat \
              -H 'Content-Type: application/json' \
              --data '{"message":"Hi, I need a flight from Cairo to Houston on August 20 for one adult. Ask me for any missing booking details."}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("choices",[{}])[0].get("message",{}).get("content") or d)'
            echo
            echo '=== DEPLOY COMPLETE ==='
