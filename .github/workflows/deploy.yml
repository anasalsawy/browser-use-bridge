name: Deploy VM services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/azureuser/browser-use-bridge
            git fetch origin main
            git reset --hard origin/main
            echo '=== NODE ==='
            /usr/bin/node --version

            echo '=== VERIFY AI TOKEN ==='
            test -f /home/azureuser/browser-use-bridge/.env
            grep '^HF_TOKEN=' /home/azureuser/browser-use-bridge/.env >/dev/null || { echo 'ERROR: HF_TOKEN missing'; exit 1; }
            grep '^HF_TOKEN=' /home/azureuser/browser-use-bridge/.env | sudo tee /etc/leadpilotai-agent.env >/dev/null
            sudo chmod 640 /etc/leadpilotai-agent.env
            sudo chown root:azureuser /etc/leadpilotai-agent.env

            echo '=== VERIFY VM EXEC TOKEN ==='
            grep '^VM_EXEC_TOKEN=' /home/azureuser/browser-use-bridge/.env >/dev/null || { echo 'ERROR: VM_EXEC_TOKEN missing'; exit 1; }

            echo '=== INSTALL/RESTART AGENT ==='
            sudo cp travel-sales-agent/travel-sales-agent.service /etc/systemd/system/travel-sales-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable travel-sales-agent
            sudo systemctl restart travel-sales-agent
            sleep 3
            sudo systemctl is-active --quiet travel-sales-agent

            echo '=== HEALTH ==='
            curl -fsS http://127.0.0.1:8890/health
            echo

            echo '=== AI + VM TOOL TEST ==='
            RESPONSE="$(curl -fsS --max-time 90 -X POST http://127.0.0.1:8890/chat -H 'Content-Type: application/json' --data '{"message":"Use the vm_exec tool to run: printf BROWSER_BRIDGE_WORKING. Then reply with exactly the tool output."}')"
            printf '%s\n' "$RESPONSE"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); c=d.get("choices",[{}])[0].get("message",{}).get("content",""); assert "BROWSER_BRIDGE_WORKING" in c, d; print("AI_VM_TOOL_OK")' "$RESPONSE"

            echo '=== AGENT WORKING ==='
